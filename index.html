<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Demografie · KEN</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-elev: #f4f4f4;
    --line: #e5e5e5;
    --line-strong: #d4d4d4;
    --fg: #0a0a0a;
    --fg-2: #404040;
    --dim: #737373;
    --muted: #a3a3a3;
    --accent: #0a0a0a;
    --accent-fg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  body { min-height: 100vh; padding-bottom: 60px; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  .app { max-width: 640px; margin: 0 auto; padding: 0 20px; }
  .header { position: sticky; top: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); z-index: 10; margin: 0 -20px 24px; padding: 14px 20px; }
  .header-row { max-width: 600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-mark { width: 26px; height: 26px; background: var(--fg); border-radius: 4px; }
  .brand-name { font-size: 12px; font-weight: 600; letter-spacing: 1px; }
  .brand-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .ai-badge { font-size: 9px; padding: 3px 7px; border-radius: 3px; font-weight: 700; letter-spacing: 0.5px; }
  .ai-badge.on { background: var(--fg); color: var(--bg); }
  .ai-badge.off { background: var(--bg-elev); color: var(--dim); border: 1px solid var(--line); }
  .header-x { background: transparent; border: none; color: var(--dim); font-size: 22px; padding: 0; width: 26px; height: 26px; line-height: 1; }

  /* Login */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-inner { max-width: 420px; width: 100%; }
  .login-pre { font-size: 11px; letter-spacing: 1.5px; color: var(--dim); font-weight: 500; margin-bottom: 20px; }
  .login-h1 { font-size: clamp(44px, 11vw, 60px); font-weight: 700; letter-spacing: -2px; line-height: 1; margin-bottom: 20px; }
  .login-h1 .light { font-weight: 300; color: var(--dim); }
  .login-lead { font-size: 15px; color: var(--fg-2); margin-bottom: 32px; line-height: 1.55; }
  .login-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .input-text { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--fg); font-size: 16px; outline: none; transition: border-color 0.15s; }
  .input-text:focus { border-color: var(--fg); }
  .btn-primary { padding: 14px 20px; background: var(--fg); color: var(--bg); border: none; border-radius: 6px; font-size: 15px; font-weight: 600; transition: opacity 0.15s; }
  .btn-primary:disabled { opacity: 0.3; cursor: default; }
  .btn-secondary { padding: 12px 18px; background: var(--bg); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 6px; font-size: 14px; font-weight: 500; }
  .login-existing { padding-top: 24px; border-top: 1px solid var(--line); }
  .login-ex-label { font-size: 10px; letter-spacing: 1px; color: var(--dim); margin-bottom: 10px; font-weight: 500; text-transform: uppercase; }
  .login-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .login-chip { padding: 6px 11px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--fg); }
  .login-chip-pts { color: var(--dim); margin-left: 6px; font-size: 11px; }
  .login-foot { margin-top: 32px; font-size: 10px; letter-spacing: 1px; color: var(--muted); text-align: center; }

  /* Home */
  .hero { padding: 12px 0 24px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .hero-label { font-size: 10px; letter-spacing: 1.5px; color: var(--fg); font-weight: 600; margin-bottom: 12px; }
  .hero-num { font-size: clamp(80px, 22vw, 110px); font-weight: 700; letter-spacing: -4px; line-height: 0.85; }
  .hero-sub { font-size: 16px; color: var(--dim); margin-left: 10px; font-weight: 400; }
  .hero-chips { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .hero-chip { font-size: 11px; padding: 4px 9px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 999px; color: var(--fg-2); }
  .hero-chip.weak { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .big-cta { width: 100%; padding: 18px 22px; background: var(--fg); color: var(--bg); border: none; border-radius: 8px; font-size: 16px; font-weight: 600; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; }
  .big-cta-arrow { font-size: 20px; }
  .big-cta-done { width: 100%; padding: 18px 22px; background: var(--bg-soft); color: var(--dim); border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-weight: 500; cursor: default; margin-bottom: 22px; text-align: center; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
  .stat { background: var(--bg-soft); border: 1px solid var(--line); padding: 16px; border-radius: 8px; }
  .stat-num { font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .stat-slash { font-size: 14px; color: var(--dim); font-weight: 400; }
  .stat-label { font-size: 11px; color: var(--dim); margin-top: 6px; letter-spacing: 0.8px; text-transform: uppercase; font-weight: 500; }

  .menu { display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px; }
  .menu-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); text-align: left; }
  .menu-item:hover { background: var(--bg-soft); }
  .menu-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: var(--bg-elev); border-radius: 5px; font-size: 14px; font-weight: 700; }
  .menu-main { flex: 1; }
  .menu-title { font-size: 14px; font-weight: 500; }
  .menu-desc { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .menu-arrow { color: var(--dim); font-size: 16px; }

  .footer { font-size: 10px; color: var(--muted); text-align: center; margin-top: 36px; letter-spacing: 0.5px; }

  /* Study */
  .study-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 14px; }
  .study-prog-num { font-size: 22px; font-weight: 700; }
  .study-prog-denom { font-size: 13px; color: var(--dim); }
  .study-chap { font-size: 11px; letter-spacing: 1px; font-weight: 600; text-align: center; }
  .study-pts { font-size: 16px; font-weight: 700; text-align: right; }

  .dots { display: flex; gap: 4px; margin-bottom: 26px; }
  .dot { flex: 1; height: 2px; background: var(--line); }
  .dot.active { background: var(--fg); }

  .stage-badge { display: inline-block; font-size: 10px; letter-spacing: 1px; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; padding: 4px 9px; background: var(--fg); color: var(--bg); border-radius: 3px; }
  .concept-title { font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 1.15; margin-bottom: 22px; }
  .question { font-size: 18px; font-weight: 500; line-height: 1.4; margin-bottom: 20px; color: var(--fg); }

  .theory-box { margin-bottom: 18px; }
  .theory-line { font-size: 15px; line-height: 1.65; color: var(--fg-2); margin-bottom: 10px; white-space: pre-wrap; }
  .example-box { background: var(--bg-soft); border: 1px solid var(--line); border-left: 3px solid var(--fg); padding: 14px 16px; margin-bottom: 22px; border-radius: 4px; }
  .example-label { font-size: 10px; letter-spacing: 1px; font-weight: 600; margin-bottom: 6px; }
  .example-text { font-size: 14px; line-height: 1.55; color: var(--fg-2); }

  .input-text-correct { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .input-text-wrong { border-color: var(--line-strong); border-style: dashed; }

  .hint-box { padding: 11px 14px; background: var(--bg-soft); border: 1px dashed var(--line-strong); border-radius: 6px; font-size: 13px; color: var(--fg-2); margin-bottom: 14px; font-style: italic; }
  .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn-row .btn-primary { flex: 2; }

  .textarea { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--fg); font-size: 15px; line-height: 1.5; outline: none; resize: vertical; min-height: 140px; transition: border-color 0.15s; }
  .textarea:focus { border-color: var(--fg); }
  .char-count { font-size: 11px; color: var(--muted); text-align: right; margin: 6px 0 14px; }

  .mc-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .mc-option { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); font-size: 15px; text-align: left; width: 100%; transition: all 0.15s; }
  .mc-option:hover:not(:disabled) { background: var(--bg-soft); border-color: var(--line-strong); }
  .mc-option:disabled { cursor: default; }
  .mc-letter { font-size: 11px; color: var(--dim); width: 14px; flex-shrink: 0; font-weight: 600; }
  .mc-text { flex: 1; line-height: 1.4; }
  .mc-mark { font-size: 16px; font-weight: 700; }
  .mc-correct { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .mc-correct .mc-letter { color: var(--bg); }
  .mc-wrong { background: var(--bg-soft); border-color: var(--line-strong); border-style: dashed; opacity: 0.7; }
  .mc-dimmed { opacity: 0.4; }

  .feedback { padding: 13px 16px; font-weight: 600; font-size: 14px; margin-bottom: 14px; border-radius: 6px; }
  .feedback-ok { background: var(--fg); color: var(--bg); }
  .feedback-bad { background: var(--bg-elev); color: var(--fg); border: 1px dashed var(--line-strong); }
  .feedback-partial { background: var(--bg-soft); color: var(--fg); border: 1px solid var(--fg); }
  .feedback-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 10px; letter-spacing: 1px; opacity: 0.85; }
  .feedback-text { font-size: 14px; line-height: 1.5; font-weight: 400; }

  .sol-box { border: 1px solid var(--line); padding: 13px 16px; margin-bottom: 14px; border-radius: 6px; background: var(--bg-soft); }
  .sol-label { font-size: 10px; letter-spacing: 1px; color: var(--dim); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
  .sol-text { font-size: 15px; font-weight: 600; color: var(--fg); }
  .sol-text-long { font-size: 14px; line-height: 1.6; color: var(--fg-2); }
  .missing-list { margin: 0; padding-left: 18px; list-style: disc; }
  .missing-item { font-size: 13px; line-height: 1.5; color: var(--fg-2); margin-bottom: 4px; }

  .ai-loading { padding: 36px 20px; text-align: center; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 6px; }
  .ai-loading-dot { width: 10px; height: 10px; background: var(--fg); border-radius: 50%; margin: 0 auto 14px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .ai-loading-text { font-size: 12px; color: var(--dim); letter-spacing: 0.5px; }

  .compare-block { margin-bottom: 14px; }
  .compare-label { font-size: 10px; letter-spacing: 1px; color: var(--dim); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
  .compare-yours { padding: 13px 16px; background: var(--bg-soft); border-radius: 6px; font-size: 14px; line-height: 1.55; color: var(--fg-2); border: 1px solid var(--line); }
  .compare-model { padding: 13px 16px; background: var(--fg); color: var(--bg); border-radius: 6px; font-size: 14px; line-height: 1.55; }
  .checklist { margin: 0; padding-left: 18px; }
  .checklist-item { font-size: 13px; line-height: 1.5; color: var(--fg-2); margin-bottom: 5px; }

  .judge-prompt { padding: 13px 16px; border: 1px solid var(--fg); border-radius: 6px; font-size: 14px; line-height: 1.5; margin-bottom: 14px; background: var(--bg); }

  .exit-btn { width: 100%; padding: 10px; margin-top: 12px; background: transparent; border: none; color: var(--dim); font-size: 12px; letter-spacing: 0.5px; }

  .session-end { text-align: center; padding: 32px 0; }
  .session-end-num { font-size: 88px; font-weight: 700; letter-spacing: -3px; line-height: 1; margin: 10px 0 6px; }
  .session-end-label { font-size: 12px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 22px; font-weight: 500; }
  .session-end-text { font-size: 16px; line-height: 1.5; color: var(--fg-2); margin-bottom: 28px; max-width: 400px; margin-left: auto; margin-right: auto; }

  .test-result-hero { text-align: center; padding: 24px 0; }
  .test-result-num { font-size: 80px; font-weight: 700; letter-spacing: -3px; line-height: 1; }
  .test-result-denom { font-size: 28px; color: var(--dim); font-weight: 400; }
  .test-result-verdict { font-size: 12px; letter-spacing: 1.5px; font-weight: 700; margin: 14px 0 18px; }
  .test-result-meta { display: flex; justify-content: center; gap: 12px; color: var(--dim); font-size: 13px; align-items: center; }
  .test-result-meta-num { color: var(--fg); font-weight: 600; margin-right: 4px; }

  .review-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .review-item { background: var(--bg-soft); border: 1px solid var(--line); border-left-width: 3px; padding: 12px 14px; border-radius: 4px; }
  .review-item.correct { border-left-color: var(--fg); }
  .review-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .review-idx { font-size: 11px; color: var(--dim); }
  .review-chap { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
  .review-mark { margin-left: auto; font-weight: 700; font-size: 14px; }
  .review-q { font-size: 13px; font-style: italic; margin-bottom: 6px; line-height: 1.4; }
  .review-ans-row { font-size: 13px; color: var(--fg-2); margin-bottom: 2px; line-height: 1.5; }
  .review-ans-label { font-size: 10px; color: var(--muted); margin-right: 4px; letter-spacing: 0.5px; text-transform: uppercase; }

  .page-pre { font-size: 11px; letter-spacing: 1.5px; color: var(--dim); font-weight: 500; margin-bottom: 10px; text-transform: uppercase; }
  .page-title { font-size: 36px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 10px; }
  .page-sub { color: var(--dim); font-size: 14px; line-height: 1.55; margin-bottom: 22px; }

  .chap-block { margin-bottom: 24px; }
  .chap-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .chap-num { font-size: 13px; font-weight: 700; margin-right: 10px; }
  .chap-title { font-size: 14px; font-weight: 500; }
  .chap-stats { font-size: 11px; color: var(--dim); }
  .concept-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .concept-row-name { font-size: 14px; color: var(--fg-2); flex: 1; }
  .mastery-dots { display: flex; gap: 3px; }
  .mastery-dot { width: 6px; height: 6px; border: 1px solid var(--dim); border-radius: 50%; }
  .mastery-dot.filled { background: var(--fg); border-color: var(--fg); }

  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg-soft); margin-bottom: 18px; border-radius: 6px; border: 1px solid var(--line); }
  .tab { flex: 1; padding: 9px 12px; background: transparent; border: none; font-size: 13px; font-weight: 500; color: var(--dim); border-radius: 4px; }
  .tab.active { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

  .lb-list { border-top: 1px solid var(--line); }
  .lb-empty { padding: 30px; text-align: center; color: var(--dim); font-style: italic; font-size: 14px; }
  .lb-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; padding: 12px 8px; align-items: center; border-bottom: 1px solid var(--line); }
  .lb-row.self { background: var(--fg); color: var(--bg); border-radius: 4px; padding-left: 12px; padding-right: 12px; }
  .lb-row.self .lb-rank, .lb-row.self .lb-time { color: var(--bg); opacity: 0.7; }
  .lb-row.self .lb-pts { color: var(--bg); }
  .lb-rank { font-size: 12px; font-weight: 600; color: var(--dim); }
  .lb-name { font-size: 14px; font-weight: 500; }
  .lb-you { font-size: 10px; opacity: 0.7; margin-left: 6px; }
  .lb-pts { font-size: 16px; font-weight: 700; }
  .lb-test-right { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .lb-time { font-size: 10px; color: var(--dim); }

  .test-badge { font-size: 10px; letter-spacing: 1px; padding: 3px 8px; border-radius: 3px; font-weight: 700; background: var(--fg); color: var(--bg); justify-self: center; }

  .loading-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .loading-dot { width: 8px; height: 8px; background: var(--fg); border-radius: 50%; animation: pulse 1s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const PROXY_URL = 'https://demografie-proxy-nuw2.vercel.app/api/evaluate';

// ============================================================
// CONTENT — 30 Konzepte mit Verständnisfokus
// Pflichtpunkte umfassend definiert für AI-Bewertung
// ============================================================
const CONCEPTS = [
  // K1
  { id:'k1a', chapter:1, title:'Bevölkerungswachstum global',
    theory:'Vom Jahr 0 bis 1800 brauchte die Welt 1800 Jahre, um von 200 Mio. auf 1 Mia. zu wachsen.\n\nVon 1800 bis heute (~8 Mia.) waren es nur ~220 Jahre. Das ist exponentielles Wachstum durch die Industrialisierung.\n\nMeilensteine: 1930→2 Mia, 1960→3, 1974→4, 1987→5, 1999→6, 2011→7, 2022→8.',
    example:'Verdoppelung 1→2 Mia: 130 Jahre. Verdoppelung 2→4 Mia: 44 Jahre. Wachstum hat sich beschleunigt.',
    recall:{ q:'Welche zwei Faktoren öffneten ab 1800 die Schere zwischen Geburten- und Sterberate?', accept:['medizin und hygiene','hygiene und medizin','medizinischer fortschritt und hygiene','medizin hygiene','industrialisierung'], hint:'Was sich technisch geändert hat \u2014 Gesundheit und Sauberkeit.' },
    mc:{ q:'Was war der Hauptauslöser für das exponentielle Bevölkerungswachstum nach 1800?', options:['Mehr Krieg', 'Industrialisierung mit Medizin/Hygiene-Fortschritt', 'Besseres Klima', 'Mehr Religion'], correct:1 },
    explain:{ prompt:'Erkläre warum das Bevölkerungswachstum seit 1800 so explosiv war.',
      model:'Seit 1800 fiel die Sterberate dramatisch (Industrialisierung: bessere Medizin, Hygiene, Ernährung), während die Geburtenrate noch lange hoch blieb. Diese geöffnete Schere zwischen tiefer Sterbe- und hoher Geburtenrate führt zu exponentiellem Wachstum.',
      mustInclude:['Industrialisierung als Auslöser','Sterberate fiel stark (Medizin/Hygiene/Ernährung)','Geburtenrate blieb lange hoch','Schere → exponentielles Wachstum'] } },
  { id:'k1b', chapter:1, title:'Verteilung der Menschen auf der Erde',
    theory:'Die Menschheit ist sehr ungleich verteilt:\n• die meisten leben weniger als 1000 km vom Meer entfernt\n• die meisten leben unter 500 m Höhe\n• die meisten leben in der nördlichen Hemisphäre (10°N-68°N)\n• die südliche Hemisphäre ist deutlich schwächer besiedelt',
    example:'Top 1 (1950): China 555 Mio → Top 1 (2050): Indien 1628 Mio. Klassische Industrieländer (Russland, Japan, Deutschland) verschwinden aus den Top 10.',
    recall:{ q:'Welche geografische Region (Hemisphäre) ist deutlich dichter besiedelt?', accept:['nördliche','nördliche hemisphäre','norden','nord'], hint:'Norden oder Süden?' },
    mc:{ q:'Warum sind Küstenregionen weltweit dichter besiedelt als das Landesinnere?', options:['Wärmeres Wetter überall','Handel, fruchtbares Land, milderes Klima','Religiöse Gründe','Zufall'], correct:1 },
    explain:{ prompt:'Warum sind Küstenregionen weltweit so viel dichter besiedelt als das Landesinnere?',
      model:'Küsten bieten historisch Handel über Schifffahrt, fruchtbare Schwemmlandebenen, milderes Klima durch Meereseinfluss, leichteren Transport und Zugang zu Nahrungsquellen wie Fisch. Megastädte (New York, Shanghai, Mumbai) sind fast alle Küstenstädte. Das Landesinnere ist oft trockener oder gebirgiger und schwerer zu erreichen.',
      mustInclude:['Handel/Schifffahrt','fruchtbare Böden/Schwemmland','milderes Klima','Transport/Zugänglichkeit'] } },

  // K2
  { id:'k2a', chapter:2, title:'Fertilitätsrate vs. Geburtenrate',
    theory:'Wird ständig verwechselt — klassische Prüfungsfalle.\n\nGEBURTENRATE = Lebendgeborene pro 1000 Einwohner pro Jahr (in ‰).\n\nFERTILITÄTSRATE = Anzahl Kinder pro Frau im gebärfähigen Alter, im Durchschnitt.',
    example:'Schweiz 2024: Fertilitätsrate = 1,28 Kinder pro Frau. Geburtenrate Schweiz ≈ 10‰.',
    recall:{ q:'Welche der zwei Raten hängt stark von der Altersstruktur ab?', accept:['geburtenrate','geburtenrate (pro 1000)','die geburtenrate'], hint:'Die Rate die pro 1000 Einwohner gemessen wird.' },
    mc:{ q:'Warum reicht es nicht, nur die Geburtenrate zu kennen, um zu wissen ob eine Bevölkerung sich reproduziert?', options:['Geburtenrate hängt von der Altersstruktur ab und sagt nichts über das Verhalten pro Frau','Weil sie immer falsch ist','Wegen Migration','Sie ist zu kompliziert'], correct:0 },
    explain:{ prompt:'Warum ist es wichtig, zwischen Fertilitätsrate und Geburtenrate zu unterscheiden? Welche Information geht jeweils verloren wenn man nur eine kennt?',
      model:'Die Geburtenrate (pro 1000 Einwohner) hängt stark von der Altersstruktur ab — ein altes Land hat tiefe Geburtenrate, auch wenn jede Frau viele Kinder hätte. Die Fertilitätsrate (Kinder pro Frau) zeigt das tatsächliche Geburtsverhalten unabhängig von der Altersverteilung. Nur Fertilitätsrate sagt aus, ob die Bevölkerung sich reproduziert (>2,1 nötig). Nur Geburtenrate sagt, wie viele Babys es absolut gibt.',
      mustInclude:['Geburtenrate hängt von Altersstruktur ab','Fertilitätsrate zeigt tatsächliches Verhalten','Reproduktion: nur über Fertilität messbar','beide Indikatoren ergänzen sich'] } },
  { id:'k2b', chapter:2, title:'Medianalter — was es wirklich aussagt',
    theory:'MEDIANALTER: Alter, das die Bevölkerung in zwei gleich grosse Hälften teilt — 50% jünger, 50% älter.\n\nNICHT identisch mit Durchschnittsalter (Mittelwert). Median ist robuster gegen Ausreisser.\n\nLebenserwartung ≠ Medianalter.',
    example:'Niger: Medianalter ~15 (junge Bevölkerung). Schweiz: Medianalter ~43 (überaltert). Lebenserwartung CH Frauen 85,4.',
    recall:{ q:'Was bedeutet Medianalter in einem Satz?', accept:['teilt die bevölkerung in zwei hälften','50% jünger 50% älter','hälfte jünger hälfte älter','hälfte hälfte','mitte der bevölkerung'], hint:'Aufteilung in zwei gleiche Gruppen.' },
    mc:{ q:'Ein hohes Medianalter signalisiert vor allem...', options:['hohe Geburtenrate','überalterte Gesellschaft mit wenigen Kindern','viele Migranten','hohe Säuglingssterblichkeit'], correct:1 },
    explain:{ prompt:'Was sagt ein Medianalter von 15 vs. 43 über ein Land aus — wirtschaftlich, politisch und gesellschaftlich?',
      model:'Ein Medianalter von 15 (Niger) bedeutet sehr viele Kinder, hohe Geburtenrate, demografische Belastung durch viele Abhängige (Kinder), aber demografische Dividende möglich wenn diese Kinder erwerbstätig werden. Politisch: enormer Druck auf Bildung/Gesundheit. Ein Medianalter von 43 (CH) bedeutet überalterte Gesellschaft, Erwerbstätige tragen viele Rentner, AHV unter Druck, weniger Innovation/Risikobereitschaft, aber stabile Wirtschaft.',
      mustInclude:['niedriges = junge Bevölkerung mit viel Kindern','hohes = überaltert mit vielen Rentnern','Belastung durch Abhängige (Kinder vs. Rentner)','wirtschaftliche Konsequenzen'] } },
  { id:'k2c', chapter:2, title:'Säuglingssterblichkeit als Entwicklungsindikator',
    theory:'SÄUGLINGSSTERBLICHKEIT = Zahl der gestorbenen Säuglinge (im 1. Lebensjahr) pro 1000 lebend geborenen Säuglingen.\n\nWichtigster Indikator für medizinische Versorgung und Entwicklungsstand.',
    example:'Vor 200 Jahren: oft >300/1000. Heute: CH ~3, Niger ~80, Sierra Leone ~110.',
    recall:{ q:'Warum bekommen Eltern in Ländern mit hoher Säuglingssterblichkeit oft mehr Kinder?', accept:['als sicherheit','sicherheit','altersvorsorge','damit genug überleben','reservekinder','damit kinder überleben'], hint:'Was passiert wenn nicht alle Kinder überleben \u2014 wofür braucht man dann mehr?' },
    mc:{ q:'Wenn die Säuglingssterblichkeit sinkt, geschieht langfristig meist...', options:['die Geburtenrate steigt','die Geburtenrate sinkt auch','keine Veränderung','das Land wird arm'], correct:1 },
    explain:{ prompt:'Warum führt eine sinkende Säuglingssterblichkeit langfristig auch zu einer sinkenden Geburtenrate?',
      model:'Wenn Eltern sicher sein können, dass ihre Kinder überleben, müssen sie weniger Kinder bekommen, um eine ausreichende Familiengrösse zu erreichen — speziell für die Altersversorgung in Ländern ohne Rentensystem. Wo früher 6 Kinder geboren wurden, damit 3 überleben, reicht es bei 95% Überlebensrate, 2-3 zu bekommen. Dies ist einer der Hauptmechanismen des demografischen Übergangs.',
      mustInclude:['Eltern brauchen weniger "Sicherheits"-Kinder','Altersversorgung als Motiv','Mechanismus des demografischen Übergangs','Kausalkette Sicherheit → weniger Kinder'] } },

  // K3
  { id:'k3', chapter:3, title:'Demografische Grundgleichung verstehen',
    theory:'Wachstumsrate = (Geburten - Sterbefälle) + (Einwanderung - Auswanderung)\n              = natürliches Wachstum  +  Wanderungssaldo\n\nBeide Komponenten können positiv oder negativ sein. Gesamteffekt ergibt sich aus deren Summe.',
    example:'Schweiz 2022: 7\'946 (natürlich) + 68\'760 (Migration) ≈ +76\'700 total. Ohne Migration: kaum Wachstum.',
    recall:{ q:'Wachstumsrate = ? + ?', accept:['natürliches wachstum + wanderungssaldo','natur + migration','wanderungssaldo + natürliches wachstum'], hint:'Eines hat mit Geburten zu tun, das andere mit Migration.' },
    mc:{ q:'Aussage: "Bleiben Geburten- und Sterbeziffer konstant, bleibt die Bevölkerungszahl gleich." Stimmt das?', options:['Ja, immer','Nein - wenn Geb≠Sterbe, wächst/schrumpft sie weiter','Nur wenn Migration null ist','Nur in geschlossenen Systemen'], correct:1 },
    explain:{ prompt:'Was bedeutet es konkret für ein Land wie die Schweiz, wenn das natürliche Wachstum gegen Null geht und nur noch Migration die Bevölkerungszahl hält?',
      model:'Wenn natürliches Wachstum gegen 0 geht (Geburten ≈ Sterbefälle), wird die Demografie komplett von Migration getrieben. Politische Folge: Migrationspolitik wird zur Bevölkerungspolitik. Ohne Zuwanderung schrumpft das Land. Risiken: Abhängigkeit von Migration für Arbeitskräfte und AHV-Finanzierung, gesellschaftliche Spannungen, Identitätsdebatten. Chancen: kulturelle Vielfalt, Fachkräfte. Das Trilemma wird akut.',
      mustInclude:['Demografie wird Migrations-getrieben','Migrationspolitik = Bevölkerungspolitik','Risiken: Abhängigkeit / Spannungen','ohne Migration → Schrumpfen'] } },

  // K4
  { id:'k4a', chapter:4, title:'Verdoppelungszeit-Formel & Mathematik',
    theory:'Faustformel: Verdoppelungszeit (Jahre) = 70 / Wachstumsrate (%)\n\nWoher kommt die 70? Aus Zinseszinsrechnung: ln(2) ≈ 0,693, mal 100 = 69,3 → gerundet 70.\n\nMathematik dahinter: exponentielles Wachstum N(t) = N₀ × (1+r)^t. Auflösen nach t für N(t) = 2N₀ ergibt die Formel.',
    example:'2% Wachstum: 70/2 = 35 Jahre. 1%: 70 Jahre. 0,5%: 140 Jahre.',
    recall:{ q:'Verdoppelungszeit (Jahre) = 70 / ?', accept:['wachstumsrate','wachstumsrate (%)','r','wachstum'], hint:'Nenner ist eine Prozentzahl.' },
    mc:{ q:'Wenn ein Land seine Wachstumsrate von 1% auf 2% verdoppelt, wie ändert sich die Verdoppelungszeit?', options:['verdoppelt sich auch','halbiert sich','bleibt gleich','vervierfacht sich'], correct:1 },
    explain:{ prompt:'Berechne die Wachstumsrate UND Verdoppelungszeit für: 28,4 Mio Einwohner, +910\'000/Jahr. Zeige den Rechenweg.',
      model:'Schritt 1 — Wachstumsrate: 910\'000 / 28\'400\'000 = 0,032 = 3,2%. Schritt 2 — Verdoppelungszeit: 70 / 3,2 ≈ 22 Jahre. Das ist sehr hoch — typisch für afrikanische Schwellenländer in Phase II/III des demografischen Übergangs. Kontrast Schweiz: ~0,1% natürliches Wachstum, also Verdoppelungszeit theoretisch 700 Jahre.',
      mustInclude:['Wachstumsrate ≈ 3,2%','Verdoppelungszeit ≈ 22 Jahre','Rechenweg gezeigt','Einordnung des Ergebnisses'] } },

  // K5
  { id:'k5a', chapter:5, title:'Demografischer Übergang — die 5 Phasen',
    theory:'Modell für den Wandel von Agrar- zu Dienstleistungsgesellschaft:\n\nI prätransformativ: beide Raten hoch, Bevölkerung konstant\nII frühtransformativ: Sterberate sinkt (Medizin), Geburten hoch — Schere öffnet sich\nIII mitteltransformativ: Geburten sinken langsam, HÖCHSTES Wachstum\nIV spättransformativ: Geburten sinken rasch (Verstädterung, Bildung Frauen)\nV posttransformativ: Geburten unter Sterbe, Bevölkerung schrumpft',
    example:'Niger: 50‰/11‰ = Phase II. Indien: 20‰/8‰ = Phase III. Schweiz: 10‰/8‰ = Phase V.',
    recall:{ q:'In welcher Phase ist das Wachstum am höchsten?', accept:['phase iii','phase 3','iii','3','mitteltransformativ'], hint:'Mittlere Phase — Sterberate schon tief, Geburten noch hoch.' },
    mc:{ q:'In welcher Phase öffnet sich die Schere zwischen Geburten- und Sterberate erstmals?', options:['Phase I','Phase II','Phase III','Phase V'], correct:1 },
    explain:{ prompt:'Warum öffnet sich in Phase II die Bevölkerungsschere — was passiert mit Sterberate und Geburtenrate, und warum ändern sie sich nicht zur gleichen Zeit?',
      model:'In Phase II fällt die Sterberate stark durch externe Faktoren: bessere Ernährung, Hygiene (sauberes Wasser, Abwasser), medizinischer Fortschritt (Impfungen, Antibiotika). Diese Veränderungen wirken schnell und unabhängig von kulturellen Normen. Die Geburtenrate bleibt aber hoch oder steigt sogar leicht, weil sie an tiefer verwurzelte kulturelle, religiöse und ökonomische Faktoren gebunden ist (Kinder als Altersvorsorge, Arbeitskräfte, Tradition). Diese Trägheit der Geburtenrate gegenüber der Sterberate erzeugt die Schere und damit das maximale Bevölkerungswachstum.',
      mustInclude:['Sterberate fällt durch externe/technische Faktoren','Geburtenrate ist kulturell verankert','unterschiedliche Reaktionsgeschwindigkeit','Schere = Wachstumsmaximum'] } },
  { id:'k5b', chapter:5, title:'Übergang Europa vs. Entwicklungsländer',
    theory:'Europa/Nordamerika: Übergang lief "von selbst" durch Industrialisierung. Bevölkerung wuchs 2-4-fach.\n\nEntwicklungsländer: Übergang durch IMPORTIERTE Medizin/Verhütungsmittel beschleunigt → schneller, aber Bevölkerung wuchs 7-10-fach.',
    example:'Europa 19. Jh.: ~50 Jahre für Phase II→III. Afrika heute: oft 20-30 Jahre, aber bei viel höherem Wachstum.',
    recall:{ q:'Warum wuchs die Bevölkerung in Entwicklungsländern beim Übergang stärker als in Europa?', accept:['importierte medizin','importmedizin','medizin importiert','medizin von aussen','sterberate fiel schneller','externe medizin'], hint:'Wo kam die Medizin her, die die Sterberate senkte?' },
    mc:{ q:'Was öffnete in Entwicklungsländern die Bevölkerungsschere stärker als in Europa?', options:['Mehr Geburten','Importierte Medizin senkte Sterberate schneller als Kultur sich anpasste','Klimawandel','Migration'], correct:1 },
    explain:{ prompt:'Warum wuchs die Bevölkerung in Entwicklungsländern beim Übergang prozentual stärker als in Europa, obwohl der Übergang schneller ablief?',
      model:'Paradox: Schneller heisst nicht gleichmässig. In Europa fiel Sterberate parallel zu kulturellem Wandel (Industrialisierung, Bildung) - Geburtenrate folgte zeitnah. In Entwicklungsländern wurde Sterberate durch importierte Medizin schlagartig gesenkt, ohne dass kulturelle Strukturen mitwuchsen. Die Geburtenrate konnte erst Jahrzehnte später folgen, wenn Bildung/Verstädterung griffen. Ergebnis: viel grössere Schere und über mehr Generationen → 7-10-fach statt 2-4-fach.',
      mustInclude:['Importierte Medizin senkt Sterberate schlagartig','Kulturelle Strukturen wachsen nicht mit','grössere Schere','längere Wachstumsphase'] } },

  // K6
  { id:'k6a', chapter:6, title:'Demografische Dividende — wie wird Bevölkerung zu Wachstum?',
    theory:'"Demografisches Gelegenheitsfenster": Geburtenrate sinkt UND Lebenserwartung steigt → Phase mit vielen Erwerbsfähigen (15-64), wenigen Abhängigen.\n\nUN-Definition: <30% unter 15 UND <15% über 64, ODER >55% Erwerbsfähige.',
    example:'Erfolgreich: Südkorea, Taiwan, Singapur, China (1980er-2010er). Aktuell: Indien. Nicht erreicht: Subsahara-Afrika.',
    recall:{ q:'Welche zwei demografischen Bedingungen müssen GLEICHZEITIG erfüllt sein, damit eine Dividende möglich ist?', accept:['geburtenrate sinkt und lebenserwartung steigt','sinkende geburten und steigende lebenserwartung','niedrige geburten hohe lebenserwartung','geburten runter lebenserwartung hoch'], hint:'Eine Rate sinkt, eine andere steigt.' },
    mc:{ q:'Warum erhöht eine demografische Dividende die nationale Sparquote?', options:['Erwerbstätige sparen mehr als Kinder oder Rentner','Banken zwingen zum Sparen','Religiöse Gründe','Steuern werden gesenkt'], correct:0 },
    explain:{ prompt:'Erkläre die VIER wirtschaftlichen Mechanismen, durch die die demografische Dividende Wachstum erzeugt — über reine Arbeitskraft hinaus.',
      model:'(1) Mehr Arbeitskräfte → mehr Produktion. (2) Höhere Sparquote: Erwerbstätige sparen mehr als Kinder oder Rentner — mehr Ersparnisse senken Zinsen, ermöglichen Investitionen. (3) Höheres Humankapital: weniger Kinder pro Familie → mehr Geld pro Kind für Bildung → produktivere Arbeiter in der nächsten Generation. (4) Erhöhte Frauenerwerbsbeteiligung: weniger Kinder = Frauen können arbeiten gehen, was Arbeitskräftepool erweitert.',
      mustInclude:['Mehr Arbeitskräfte/Produktion','Höhere Sparquote → Investitionen','Mehr Humankapital pro Kind durch Bildung','Frauenerwerbsbeteiligung steigt'] } },
  { id:'k6b', chapter:6, title:'Middle-Income-Trap — die Falle nach der Dividende',
    theory:'Risiko nach der Dividende: Löhne zu hoch für Billigproduktion, aber Wirtschaft nicht innovativ genug für hochwertige Produkte → Stagnation.\n\nVoraussetzungen, um Falle zu vermeiden: Arbeitsplätze, Kreditmarkt, gute Regierungsführung, Investitionen in Bildung VOR Fensteröffnung.',
    example:'China heute: kämpft genau damit. Lohnniveau zu hoch für Textilfabriken, aber Halbleiter-Innovation noch nicht auf US-Niveau.',
    recall:{ q:'Was muss laut Crombach VOR der Dividende investiert werden, um sie maximal zu nutzen?', accept:['bildung','in bildung','investitionen in bildung','schulen','bildung und gesundheit'], hint:'Was die nächste Generation produktiver macht.' },
    mc:{ q:'Warum wirkt Bildungsinvestition VOR der Dividende effektiver als währenddessen?', options:['Bildung wirkt mit 15-20 Jahren Verzögerung','Geld ist vorher billiger','Schulen sind leerer','Es gibt mehr Lehrer'], correct:0 },
    explain:{ prompt:'Warum ist Bildungsinvestition VOR der demografischen Dividende wichtiger als WÄHREND? Was ist der Mechanismus?',
      model:'Bildung wirkt mit Verzögerung von 15-20 Jahren — die heute geborenen Kinder werden erst Ende der Dividenden-Phase erwerbstätig. Wer also erst während der Dividende investiert, hat ausgebildete Arbeiter erst NACH dem Fenster. Wer VOR der Dividende investiert (Schulen aufbauen, Lehrer ausbilden), hat zur Höchstphase eine gut ausgebildete Erwerbsbevölkerung. Crombach & Smits (2021) belegen: frühe Investoren erhalten messbar höhere Dividenden.',
      mustInclude:['Bildung wirkt mit 15-20 Jahren Verzögerung','frühe Investition → ausgebildete Arbeiter im Fenster','späte Investition zu spät','Crombach & Smits Beleg'] } },

  // K7
  { id:'k7a', chapter:7, title:'UN-Prognose 2024 — die neuesten Zahlen',
    theory:'Aktuelle UN-Prognose:\n• Heute: 8,2 Mia\n• Peak ~2084 mit ~10,3 Mia (2 Jahre früher als 2022 erwartet)\n• 2100: leichter Rückgang auf ~10,2 Mia\n• 80% Wahrscheinlichkeit für Peak im 21. Jh.\n\nWachstumstreiber: Subsahara-Afrika, Indien, Pakistan. Schrumpfen: Europa, China, Japan, Südkorea.',

    mc:{ q:'Warum hat die UN 2024 ihre Bevölkerungsprognose nach UNTEN korrigiert?', options:['Mehr Krieg erwartet','Geburtenraten in Asien sinken schneller als prognostiziert','Klimawandel','Mehr Migration'], correct:1 },
    explain:{ prompt:'Warum hat die UN ihre Bevölkerungsprognose 2024 nach unten korrigiert? Welche zwei Trends sind dafür verantwortlich?',
      model:'Erstens: Geburtenraten sinken in Asien schneller als erwartet, besonders China (1,0 statt prognostizierte 1,2) und Indien. Bei diesen riesigen Ländern führt selbst kleine Korrektur zu hunderten Millionen weniger Menschen bis 2100. Zweitens: weniger Nettomigration aus Afrika in Industrieländer als ursprünglich angenommen. Globale Fertilitätsrate liegt heute bei 2,3 (1990: 3,3) und in über 50% der Weltregionen unter dem Reproduktionsniveau von 2,1.',
      mustInclude:['Geburtenraten Asien sinken schneller','China-Fertilität bei 1,0','geringere Migration aus Afrika','globale Fertilität 2,3 nahe Reproduktion'] } },
  { id:'k7b', chapter:7, title:'Reproduktionsniveau — warum 2,1 und nicht 2,0',
    theory:'Reproduktionsniveau = 2,1 Kinder pro Frau.\n\nDas ist die Zahl, die nötig wäre, damit eine Bevölkerung langfristig OHNE Migration konstant bleibt.\n\nWarum 2,1 und nicht 2,0? Sicherheitsaufschlag: nicht alle geborenen Mädchen erreichen das gebärfähige Alter (Kindersterblichkeit, Unfälle, Kinderlosigkeit).',
    example:'Schweiz 2024: 1,28 → weit unter Reproduktion. >50% der Weltregionen unter 2,1.',
    recall:{ q:'Warum liegt das Reproduktionsniveau nicht bei genau 2 Kindern pro Frau?', accept:['weil nicht alle das gebärfähige alter erreichen','sterblichkeit','kindersterblichkeit','weil manche sterben','sicherheitsaufschlag','nicht alle überleben','weil mädchen sterben'], hint:'Was passiert mit manchen Mädchen vor dem fortpflanzungsfähigen Alter?' },
    mc:{ q:'Warum schrumpft eine Bevölkerung NICHT sofort, wenn die Fertilität unter 2,1 fällt?', options:['Weil die Statistik falsch ist','Demografisches Trägheitsmoment: grosse Mütter-Kohorten zeugen weiter','Wegen Migration','Zufall'], correct:1 },
    explain:{ prompt:'Warum schrumpft eine Bevölkerung nicht sofort, sobald die Fertilität unter 2,1 fällt — sondern erst Jahrzehnte später?',
      model:'Demografisches Trägheitsmoment: Wenn die Geburtenrate sinkt, bekommen die geburtenstarken Jahrgänge (z.B. Babyboomer) ihre Kinder. Selbst wenn jede einzelne dieser Frauen weniger Kinder bekommt, gibt es so viele potentielle Mütter, dass die absolute Geburtenzahl noch hoch bleibt. Erst wenn die kleineren Geburtsjahrgänge ihrerseits ins gebärfähige Alter kommen — etwa 25-30 Jahre nach Rückgang der Fertilität — schlagen weniger Geburten auf die Gesamtbevölkerung durch. Das ist warum China 2024 erst zu schrumpfen beginnt, obwohl die Geburtenrate seit den 1990ern unter 2,1 lag.',
      mustInclude:['Trägheitsmoment durch grosse Mütter-Kohorten','geburtenstarke Jahrgänge zeugen weiter','Verzögerung 25-30 Jahre','Bsp China'] } },
  { id:'k7c', chapter:7, title:'Weltbevölkerungskonferenz Kairo 1994',
    theory:'Wendepunkt der internationalen Bevölkerungspolitik.\n\nVorher: Geburtenkontrolle, oft Zwang.\n\nKairo-Prinzipien:\n• Freiwilligkeit & Menschenwürde\n• Familienplanung als Recht für alle\n• Abtreibung NICHT als Mittel der Familienplanung\n• Erziehung & Stärkung von Frauen = effektivster Weg\n• 179 Staaten, 11\'000 Teilnehmer',

    mc:{ q:'Warum ist Bildung von Frauen der wirksamste Hebel gegen hohe Geburtenraten?', options:['Frauen werden gezwungen weniger Kinder zu haben','Spätere Heirat, höhere Opportunitätskosten, ökonomische Unabhängigkeit','Frauen verstehen Verhütung besser','Mehr Geld in der Familie'], correct:1 },

      model:'Mehrere kausale Mechanismen: (1) Gebildete Frauen heiraten später → spätere erste Geburt → kürzere fruchtbare Phase. (2) Gebildete Frauen verfolgen Karrieren → höhere Opportunitätskosten von Kindern. (3) Bildung erhöht ökonomische Unabhängigkeit → Frauen können selbst entscheiden über Kinderzahl. (4) Gebildete Mütter haben gesündere Kinder → niedrigere Säuglingssterblichkeit → weniger "Sicherheits"-Geburten nötig. (5) Wissen über Verhütung. (6) Vorbildwirkung in der Gemeinschaft. All diese Effekte multiplizieren sich.',
      mustInclude:['späteres Heiraten verkürzt fruchtbare Phase','Opportunitätskosten durch Karriere','ökonomische Unabhängigkeit','niedrigere Säuglingssterblichkeit reduziert Sicherheitsgeburten'] } },

  { id:'k8a', chapter:8, title:'Ein-Kind-Politik China — Bilanz',
    theory:'China 1979 - ~2015: Ein-Kind-Politik mit Zwang.\n\nMethoden: Strafen >Jahresgehalt, Belohnungen für Einzelkinder, Zwangsabtreibungen bis 9. Monat.\n\nErfolg in Zahl: 1,3 Mia statt 1,6 Mia.\n\nFolgen:\n• Frauenmangel: 117 Jungen pro 100 Mädchen\n• 80 Mio verhätschelte Einzelkinder\n• Drastische Überalterung\n\nSeit 2015 gelockert, seit 2021 Drei-Kind-Politik. Geburtenrate fällt trotzdem weiter.',

    mc:{ q:'Warum sinkt Chinas Geburtenrate weiter, obwohl seit 2021 drei Kinder erlaubt sind?', options:['Verbote sind noch aktiv','35 Jahre Einzelkind-Norm haben kulturell verinnerlicht','Wegen Klimawandel','Zufall'], correct:1 },

function buildDailyPlan(progress, currentDay) {
  const NEW_PER_DAY = 5;
  const review = [];
  CONCEPTS.forEach(c => {
    const p = progress[c.id];
    if (!p || !p.lastSeen) return;
    const daysSince = currentDay - p.lastSeen;
    const stage = p.masteryStage || 0;
    const intervals = [0, 1, 3, 7, 999];
    if (daysSince >= intervals[stage] && stage < 4) review.push(c);
  });
  const weakFirst = CONCEPTS.filter(c => {
    const p = progress[c.id];
    return p && p.attempts > 0 && p.correct / p.attempts < 0.5 && (p.masteryStage || 0) < 4;
  });
  const unseen = CONCEPTS.filter(c => !progress[c.id]);
  const newToday = unseen.slice(0, NEW_PER_DAY);
  const combined = [...weakFirst];
  review.forEach(r => { if (!combined.find(c => c.id === r.id)) combined.push(r); });
  newToday.forEach(n => combined.push(n));
  return {
    queue: combined,
    masteredCount: Object.values(progress).filter(p => p.masteryStage >= 4).length,
    totalConcepts: CONCEPTS.length,
    weakCount: weakFirst.length,
    newCount: newToday.length,
    reviewCount: review.length,
  };
}
function checkRecall(userAnswer, accepted) {
  const norm = s => s.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.!?,;:]/g, '');
  const u = norm(userAnswer);
  if (!u) return false;
  return accepted.some(a => {
    const an = norm(a);
    return u === an || u.includes(an) || an.includes(u);
  });
}
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// ============================================================
// STORAGE (localStorage) - pro User
// ============================================================
const KEYS = { user:'demo_user_v5', scores:'demo_scores_v5', tests:'demo_tests_v5' };
function progressKey(user) { return 'demo_prog_v5_' + user; }
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
  del(k) { try { localStorage.removeItem(k); } catch(e) {} }
};

// ============================================================
// STATE
// ============================================================
const state = {
  view: 'login',
  user: '',
  progress: {},
  scores: {},
  tests: [],
  aiAvailable: null,
  currentDay: Math.floor(Date.now() / 86400000),
  studyConcepts: [],
  studyIdx: 0,
  studyStage: 'theory',
  studySessionPts: 0,
  testQs: [],
  testIdx: 0,
  testAnswers: {},
  testStart: 0,
  testDone: false,
};

function loadState() {
  state.user = store.get(KEYS.user, '');
  state.scores = store.get(KEYS.scores, {});
  state.tests = store.get(KEYS.tests, []);
  if (state.user) {
    state.progress = store.get(progressKey(state.user), {});
    state.view = 'home';
  } else {
    state.progress = {};
  }
}
function saveProg() { if (state.user) store.set(progressKey(state.user), state.progress); }
function saveScores() { store.set(KEYS.scores, state.scores); }
function saveTests() { store.set(KEYS.tests, state.tests); }
function addPoints(pts) {
  state.scores[state.user] = (state.scores[state.user] || 0) + pts;
  saveScores();
  // Sync to shared leaderboard
  fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'addPoints', user: state.user, points: pts })
  }).catch(() => {});
}
async function fetchLeaderboard() {
  try {
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getLeaderboard' })
    });
    const data = await res.json();
    if (data.leaderboard) {
      // Convert array of [name, pts] to object
      const obj = {};
      data.leaderboard.forEach(([n, p]) => { obj[n] = p; });
      state.scores = obj;
      saveScores();
    }
  } catch (e) {}
}
async function fetchTests() {
  try {
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getTests' })
    });
    const data = await res.json();
    if (data.tests) {
      state.tests = data.tests;
      saveTests();
    }
  } catch (e) {}
}
function recordConcept(id, correct, points) {
  const cur = state.progress[id] || { masteryStage: 0, lastSeen: null, attempts: 0, correct: 0 };
  state.progress[id] = {
    masteryStage: correct ? Math.min(cur.masteryStage + 1, 4) : cur.masteryStage,
    lastSeen: state.currentDay,
    attempts: cur.attempts + 1,
    correct: cur.correct + (correct ? 1 : 0),
  };
  saveProg();
  if (points > 0) addPoints(points);
}

function renderStudy() {
  if (state.studyIdx >= state.studyConcepts.length) {
    renderSessionEnd();
    return;
  }
  const concept = state.studyConcepts[state.studyIdx];
  const stages = ['theory', 'recall', 'mc', 'explain'];
  const stageNames = { theory: 'LESEN', recall: 'ABRUFEN', mc: 'WÄHLEN', explain: 'ERKLÄREN' };

  let stageHtml = '';
  if (state.studyStage === 'theory') stageHtml = renderTheory(concept);
  else if (state.studyStage === 'recall') stageHtml = renderRecall(concept);
  else if (state.studyStage === 'mc') stageHtml = renderMc(concept);
  else if (state.studyStage === 'explain') stageHtml = renderExplain(concept);

  root.innerHTML = `
    ${renderHeader()}
    <div class="app">
      <div class="study-top">
        <div><span class="study-prog-num">${state.studyIdx + 1}</span><span class="study-prog-denom">/${state.studyConcepts.length}</span></div>

      </div>
      <div class="dots">
        ${stages.map(s => `<div class="dot ${stages.indexOf(state.studyStage) >= stages.indexOf(s) ? 'active' : ''}"></div>`).join('')}

function renderMc(c) {

        </button>
      `).join('')}

}
function submitMc(cid, idx) {
  const c = CONCEPTS.find(x => x.id === cid);
  const correct = idx === c.mc.correct;
  if (correct) {
    state.studySessionPts += 15;
    recordConcept(cid, true, 15);
  }
  const buttons = document.querySelectorAll('#mcOptions button');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === c.mc.correct) {
      btn.classList.add('mc-correct');
      btn.innerHTML += '<span class="mc-mark">✓</span>';
    } else if (i === idx) {
      btn.classList.add('mc-wrong');
      btn.innerHTML += '<span class="mc-mark">✗</span>';
    } else {
      btn.classList.add('mc-dimmed');
    }
  });
  const fb = document.createElement('div');
  fb.className = 'feedback ' + (correct ? 'feedback-ok' : 'feedback-bad');
  fb.textContent = correct ? '✓ Richtig — +15 Punkte' : '✗ Falsch';
  document.getElementById('mcOptions').after(fb);
  const next = document.createElement('button');
  next.className = 'btn-primary';
  next.style.width = '100%';
  next.textContent = 'Weiter zum Erklären →';

async function submitExplain(cid) {
  const c = CONCEPTS.find(x => x.id === cid);
  const text = document.getElementById('explainText').value.trim();
  if (!text) return;

  document.getElementById('explainContent').innerHTML = `
    <div class="ai-loading">
      <div class="ai-loading-dot"></div>
      <div class="ai-loading-text">KI bewertet deine Antwort…</div>
    </div>`;

  const systemPrompt = `Du bist ein strenger Geografielehrer (KEN, Schweiz, Gymnasium).

Bewerte die Antwort eines Schülers auf:
"${c.explain.prompt}"

Diese Punkte MÜSSEN sinngemäss vorkommen:
${c.explain.mustInclude.map((m, i) => (i+1) + '. ' + m).join('\n')}

Antworte AUSSCHLIESSLICH als JSON:
{"verdict":"correct"|"partial"|"wrong","text":"1-2 Sätze ehrliches Feedback auf Deutsch, hart aber fair","missing":["fehlender Punkt 1","..."]}

Regeln:
- "correct": ALLE Pflichtpunkte sinngemäss da
- "partial": einige fehlen, aber Grundverständnis erkennbar
- "wrong": grundlegend falsch oder Mehrheit fehlt`;

  try {
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'evaluate', systemPrompt, userMessage: 'Antwort des Schülers:\n\n' + text }),
    });
    if (!res.ok) throw new Error('Server error ' + res.status);
    const data = await res.json();
    if (data._debugError) {
      throw new Error('DEBUG: ' + JSON.stringify(data, null, 2));
    }
    const respText = data.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
    const cleaned = respText.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    state.aiAvailable = true;
    showAiResult(cid, parsed, text);
    recordConcept(cid, parsed.verdict === 'correct', parsed.verdict === 'correct' ? 25 : 0);
    if (parsed.verdict === 'correct') state.studySessionPts += 25;
  } catch (e) {
    state.aiAvailable = false;
    state.lastAiError = e.message || String(e);
    showSelfCompare(cid, text);
  }
}

function showAiResult(cid, ai, userText) {
  const c = CONCEPTS.find(x => x.id === cid);

  const verdictText = ai.verdict === 'correct' ? '+25P' : 'Keine Punkte';
  document.getElementById('explainContent').innerHTML = `
    <div class="feedback ${fbClass}">
      <div class="feedback-head"><span>KI-FEEDBACK</span><span>${verdictText}</span></div>
      <div class="feedback-text">${escapeHtml(ai.text)}</div>

  // re-render header to update AI badge
  document.querySelector('.header').outerHTML = renderHeader();
}

function showSelfCompare(cid, userText) {
  const c = CONCEPTS.find(x => x.id === cid);
  const errMsg = state.lastAiError ? `<div style="font-family:monospace;font-size:11px;color:#a00;background:#fee;padding:8px;border-radius:4px;margin-bottom:10px;word-break:break-all">DEBUG: ${escapeHtml(state.lastAiError)}</div>` : '';
  document.getElementById('explainContent').innerHTML = `

      <div class="compare-yours">${escapeHtml(userText)}</div>
    </div>
    <div class="compare-block">
      <div class="compare-label">Musterlösung</div>
      <div class="compare-model">${escapeHtml(c.explain.model)}</div>
    </div>

      <div class="compare-label">Pflichtpunkte</div>

    </div>`;
  document.querySelector('.header').outerHTML = renderHeader();

    </div>`;
}

// ============================================================
// TEST MODE
// ============================================================
function renderTest() {
  if (state.testDone) { renderTestResults(); return; }
  if (state.testIdx >= state.testQs.length) { finishTest(); renderTestResults(); return; }
  const q = state.testQs[state.testIdx];
  const elapsed = Math.round((Date.now() - state.testStart) / 1000);
  root.innerHTML = `
    ${renderHeader()}
    <div class="app">
      <div class="study-top">
        <div><span class="study-prog-num">${state.testIdx + 1}</span><span class="study-prog-denom">/${state.testQs.length}</span></div>
        <div class="test-badge">● TEST</div>
        <div class="study-pts">${formatTime(elapsed)}</div>
      </div>
      <span class="stage-badge">K${q.chapter} · Keine Hinweise</span>
      <h2 class="concept-title">${escapeHtml(q.title)}</h2>
      <div class="question">${escapeHtml(q.recall.q)}</div>
      <input class="input-text" id="testInput" placeholder="Antwort tippen…" autofocus>
      <button class="btn-primary" id="testSubmit" onclick="submitTestAnswer()" style="width:100%" disabled>${state.testIdx < state.testQs.length - 1 ? 'Nächste Frage →' : 'Test beenden'}</button>
      <button class="exit-btn" onclick="goHome()">Test abbrechen</button>
    </div>`;
}
function submitTestAnswer() {
  const input = document.getElementById('testInput');
  const v = input.value.trim();
  if (!v) return;
  const q = state.testQs[state.testIdx];
  state.testAnswers[q.id] = v;
  state.testIdx++;
  if (state.testIdx >= state.testQs.length) {
    finishTest();
    renderTestResults();
  } else {
    render();
  }
}
function finishTest() {
  state.testDone = true;
  let score = 0;
  state.testQs.forEach(q => {
    const ok = checkRecall(state.testAnswers[q.id] || '', q.recall.accept);
    if (ok) score++;
    recordConcept(q.id, ok, 0);
  });
  const dur = Math.round((Date.now() - state.testStart) / 1000);
  const pct = Math.round((score / state.testQs.length) * 100);
  const entry = { name: state.user, score, total: state.testQs.length, pct, durationSec: dur, ts: Date.now() };
  state.tests.push(entry);
  state.tests.sort((a,b) => b.pct - a.pct || a.durationSec - b.durationSec);
  state.tests = state.tests.slice(0, 30);
  saveTests();
  // Sync to shared leaderboard
  fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'submitTest', user: state.user, score, total: state.testQs.length, pct, durationSec: dur })
  }).catch(() => {});
}
function renderTestResults() {
  const score = state.testQs.filter(q => checkRecall(state.testAnswers[q.id] || '', q.recall.accept)).length;
  const total = state.testQs.length;
  const pct = Math.round((score/total)*100);
  const dur = Math.round((Date.now() - state.testStart) / 1000);
  const verdict = pct >= 80 ? 'STARK' : pct >= 60 ? 'OK' : 'NACHARBEITEN';
  root.innerHTML = `
    ${renderHeader()}
    <div class="app">
      <div class="test-result-hero">
        <div class="login-pre">TEST FERTIG</div>
        <div><span class="test-result-num">${score}</span><span class="test-result-denom">/${total}</span></div>
        <div class="test-result-verdict">${verdict}</div>
        <div class="test-result-meta">
          <span><span class="test-result-meta-num">${pct}%</span> korrekt</span>
          <span style="color:var(--muted)">·</span>
          <span><span class="test-result-meta-num">${formatTime(dur)}</span> Zeit</span>
        </div>
      </div>
      <div class="page-pre">Alle Fragen</div>
      <div class="review-list">
        ${state.testQs.map((q, i) => {
          const userAns = state.testAnswers[q.id] || '';
          const ok = checkRecall(userAns, q.recall.accept);
          return `
            <div class="review-item ${ok ? 'correct' : ''}">
              <div class="review-head">
                <span class="review-idx">${String(i+1).padStart(2,'0')}</span>
                <span class="review-chap">K${q.chapter}</span>
                <span class="review-mark">${ok ? '✓' : '✗'}</span>
              </div>
              <div class="review-q">${escapeHtml(q.recall.q)}</div>
              <div class="review-ans-row"><span class="review-ans-label">Richtig:</span> ${escapeHtml(q.recall.accept[0])}</div>
              ${!ok && userAns ? `<div class="review-ans-row" style="color:var(--dim)"><span class="review-ans-label">Du:</span> ${escapeHtml(userAns)}</div>` : ''}
            </div>`;
        }).join('')}
      </div>
      <button class="btn-primary" style="width:100%" onclick="goHome()">Zurück zur Home</button>
    </div>`;
}

// ============================================================
// BROWSE
// ============================================================
function renderBrowse() {
  const byChap = {};
  CONCEPTS.forEach(c => { (byChap[c.chapter] = byChap[c.chapter] || []).push(c); });
  const chapNames = {
    1:'Bevölkerungsentwicklung', 2:'Begriffe', 3:'Grundgleichung', 4:'Verdoppelungszeit',
    5:'Demografischer Übergang', 6:'Demografische Dividende', 7:'Zukunft', 8:'Bevölkerungspolitik',
    9:'Tragfähigkeit & Trilemma', 10:'Bevölkerungspyramiden', 11:'Schweiz & Folgen'
  };
  root.innerHTML = `
    ${renderHeader()}
    <div class="app">
      <div class="page-pre">Alle Kapitel</div>
      <h1 class="page-title">Übersicht</h1>
      <p class="page-sub">Reihenfolge im Lernmodus folgt deinem Spaced-Repetition-Plan automatisch.</p>
      ${Object.entries(byChap).map(([ch, items]) => {
        const mastered = items.filter(c => (state.progress[c.id]?.masteryStage || 0) >= 4).length;
        return `
          <div class="chap-block">
            <div class="chap-head">
              <div><span class="chap-num">K${ch}</span><span class="chap-title">${chapNames[ch] || ''}</span></div>
              <span class="chap-stats">${mastered}/${items.length}</span>
            </div>
            ${items.map(c => {
              const stage = state.progress[c.id]?.masteryStage || 0;
              return `
                <div class="concept-row">
                  <div class="concept-row-name">${escapeHtml(c.title)}</div>
                  <div class="mastery-dots">
                    ${[0,1,2,3].map(i => `<div class="mastery-dot ${stage > i ? 'filled' : ''}"></div>`).join('')}
                  </div>
                </div>`;
            }).join('')}
          </div>`;
      }).join('')}
    </div>`;
}

// ============================================================
// LEADERBOARD
// ============================================================
let lbTab = 'overall';
function renderLeaderboard() {
  const sortedOverall = Object.entries(state.scores).sort((a,b) => b[1]-a[1]);
  root.innerHTML = `
    ${renderHeader()}
    <div class="app">
      <div class="page-pre">Bestenliste</div>
      <h1 class="page-title">Ranking</h1>
      <div class="tabs">
        <button class="tab ${lbTab === 'overall' ? 'active' : ''}" onclick="setLbTab('overall')">Gesamt</button>
        <button class="tab ${lbTab === 'tests' ? 'active' : ''}" onclick="setLbTab('tests')">Test-Rekorde</button>
      </div>
      ${lbTab === 'overall' ? `
        <p class="page-sub">+10P Recall · +15P Multiple Choice · +25P Erklären. Lokal pro Gerät gespeichert.</p>
        <div class="lb-list">
          ${sortedOverall.length === 0 ? '<div class="lb-empty">Noch niemand. Sei der Erste.</div>' : ''}
          ${sortedOverall.map(([n,p], i) => `
            <div class="lb-row ${n === state.user ? 'self' : ''}">
              <div class="lb-rank">${String(i+1).padStart(2,'0')}</div>
              <div class="lb-name">${escapeHtml(n)}${n === state.user ? '<span class="lb-you">· du</span>' : ''}</div>
              <div class="lb-pts">${p}</div>
            </div>`).join('')}
        </div>` : `
        <p class="page-sub">Test-Modus: 10 Zufallsfragen, sortiert nach % und Zeit.</p>
        <div class="lb-list">
          ${state.tests.length === 0 ? '<div class="lb-empty">Noch keine Tests gemacht.</div>' : ''}
          ${state.tests.map((e, i) => `
            <div class="lb-row ${e.name === state.user ? 'self' : ''}">
              <div class="lb-rank">${String(i+1).padStart(2,'0')}</div>
              <div class="lb-name">${escapeHtml(e.name)}</div>
              <div class="lb-test-right">
                <span class="lb-pts">${e.pct}%</span>
                <span class="lb-time">${formatTime(e.durationSec)}</span>
              </div>
            </div>`).join('')}
        </div>`}
    </div>`;
}
function setLbTab(t) { lbTab = t; render(); }
async function openLeaderboard() {
  state.view = 'leaderboard';
  render();
  // Fetch fresh data from server in background
  await Promise.all([fetchLeaderboard(), fetchTests()]);
  if (state.view === 'leaderboard') render();
}

// ============================================================
// INIT
// ============================================================
loadState();
render();
</script>
</body>
</html>
